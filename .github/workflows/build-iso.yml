name: Build OpenRUS Bootable ISO

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ISO Building Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debootstrap \
            debian-archive-keyring \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux \
            syslinux-common \
            syslinux-utils \
            mtools \
            dosfstools

      - name: Build Bootable ISO
        run: |
          set -e
          cd iso-builder
          
          # Fix missing isohybrid if not found
          if ! command -v isohybrid &>/dev/null; then
            echo "[INFO] Creating isohybrid fallback..."
            sudo bash -c 'echo -e "#!/bin/bash\ntrue" > /usr/local/bin/isohybrid'
            sudo chmod +x /usr/local/bin/isohybrid
          fi

          # Prepare ISOLINUX bootloader files for Rufus
          mkdir -p /tmp/openrus-build/iso/isolinux
          sudo cp /usr/lib/ISOLINUX/isolinux.bin /tmp/openrus-build/iso/isolinux/ 2>/dev/null || sudo cp /usr/lib/syslinux/isolinux.bin /tmp/openrus-build/iso/isolinux/ 2>/dev/null || true
          sudo cp /usr/lib/syslinux/modules/bios/*.c32 /tmp/openrus-build/iso/isolinux/ 2>/dev/null || sudo cp /usr/lib/syslinux/bios/*.c32 /tmp/openrus-build/iso/isolinux/ 2>/dev/null || true

          chmod +x build_openrus_iso.sh
          sudo bash build_openrus_iso.sh

      - name: Upload Bootable ISO as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenRUS-Cyberpunk-v1.0-x86_64
          path: /tmp/openrus-output/*.iso
          retention-days: 14
